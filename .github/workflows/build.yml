name: build
on: [ push, pull_request ]
jobs:
  # Regenerates ngx_http_zip_parsers.c from ngx_http_zip_parsers.rl with Ragel 7 and fails
  # when the result differs from the committed file, so the grammar and the generated parser
  # cannot drift apart. On failure the regenerated file is uploaded as a build artifact.
  parser-check:
    runs-on: ubuntu-latest
    # ngx_http_zip_parsers.c is generated with Ragel 7, Ubuntu only ships Ragel 6
    container: fedora:44
    steps:
      # Prepare environment
      - name: Install Ragel 7
        run: dnf install -y ragel diffutils
      - uses: actions/checkout@v2
      - name: Ragel version
        run: ragel --version

      # Generate outside the tree, the file name ends up in #line directives
      - name: Generate parser
        run: |
          mkdir -p /tmp/ragel
          cp ngx_http_zip_parsers.rl /tmp/ragel/
          cd /tmp/ragel && ragel -o ngx_http_zip_parsers.c ngx_http_zip_parsers.rl

      # Fails when the committed parser does not match its grammar
      - name: Compare with committed parser
        run: diff -u ngx_http_zip_parsers.c /tmp/ragel/ngx_http_zip_parsers.c

      # Upload workflow run result artifact for further inspection
      - name: Upload regenerated parser code
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ngx_http_zip_parsers.c
          path: /tmp/ragel/ngx_http_zip_parsers.c

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [ static, dynamic ]
        compiler: [ gcc, clang ]
        version: [ 1.22.1, 1.24.0, 1.26.3, 1.28.0, 1.30.4, 1.31.5 ]
    steps:
      # Prepare environment
      - name: Install carton
        run: sudo apt install carton
      - uses: actions/checkout@v2
      - name: Download nginx
        run: wget http://nginx.org/download/nginx-${{ matrix.version }}.tar.gz
      - name: Untar nginx
        run: tar xvfz nginx-${{ matrix.version }}.tar.gz

      # Configure nginx with static mod_zip
      - name: Configure (static)
        if: ${{ matrix.mode == 'static' }}
        run: ./configure --prefix=${GITHUB_WORKSPACE}/t/nginx --add-module=${GITHUB_WORKSPACE}
        working-directory: nginx-${{ matrix.version }}
        env:
          CC: ${{ matrix.compiler }}
          CFLAGS: -Wno-implicit-fallthrough

      # Configure nginx without modules
      - name: Configure (nginx only)
        if: ${{ matrix.mode == 'dynamic' }}
        run: ./configure --prefix=${GITHUB_WORKSPACE}/t/nginx
        working-directory: nginx-${{ matrix.version }}
        env:
          CC: ${{ matrix.compiler }}
          CFLAGS: -Wno-implicit-fallthrough

      # Both paths require nginx to be compiled and installed
      - name: Make
        run: make -j${nproc}
        working-directory: nginx-${{ matrix.version }}
      - name: Make install
        run: make install
        working-directory: nginx-${{ matrix.version }}

      # mod_zip dynamic module
      - name: Configure (mod_zip dynamic)
        if: ${{ matrix.mode == 'dynamic' }}
        run: ./configure --prefix=${GITHUB_WORKSPACE}/t/nginx --add-dynamic-module=${GITHUB_WORKSPACE}
        working-directory: nginx-${{ matrix.version }}
        env:
          CC: ${{ matrix.compiler }}
          CFLAGS: -Wno-implicit-fallthrough
      - name: Make modules
        run: make -j${nproc} modules
        if: ${{ matrix.mode == 'dynamic' }}
        working-directory: nginx-${{ matrix.version }}
      - name: Add load_module to nginx.conf
        if: ${{ matrix.mode == 'dynamic' }}
        run: sed -i "1iload_module ${GITHUB_WORKSPACE}/nginx-${{ matrix.version}}/objs/ngx_http_zip_module.so;" ${GITHUB_WORKSPACE}/t/nginx.conf

      # Run test harness
      - name: Start nginx
        run: ./restart.sh
        working-directory: t
      - name: Carton install
        run: carton install
        working-directory: t
      - name: Carton exec
        run: carton exec ./ziptest.pl
        working-directory: t
